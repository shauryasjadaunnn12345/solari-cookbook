<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShipProof</title><style>
:root{color-scheme:dark;--ink:#edf2f4;--muted:#9da9ad;--line:#2b383d;--panel:#132125;--accent:#f5b544;--good:#6bd89b;--bad:#ff7777}*{box-sizing:border-box}body{margin:0;background:#0b1417;color:var(--ink);font:16px Georgia,serif}main{max-width:1100px;margin:auto;padding:38px 24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px}h1{font-size:32px;margin:0}h2{margin:12px 0}.eyebrow{font:11px system-ui;letter-spacing:.15em;color:var(--accent);text-transform:uppercase}.status{font:13px system-ui;color:var(--good)}.hero{padding:56px 0}.panel{background:var(--panel);border:1px solid var(--line);padding:24px;border-radius:6px;margin-bottom:16px}p{color:var(--muted);line-height:1.5}.launch{display:flex;gap:10px;margin-top:28px}input{flex:1;background:#0b1417;border:1px solid var(--line);color:var(--ink);padding:14px;border-radius:4px}button{background:var(--accent);border:0;padding:14px 19px;border-radius:4px;font-weight:bold;cursor:pointer}.stop{background:transparent;color:var(--bad);border:1px solid var(--bad);margin-left:8px}.hidden{display:none}.event{border-left:2px solid var(--accent);padding:10px 16px;margin:10px 0;background:#101c20;font:14px system-ui}.error{border-color:var(--bad)}.bug{border-color:var(--good)}.shot{max-width:100%;margin-top:12px;border:1px solid var(--line)}.meta{font:13px system-ui;color:var(--muted)}
</style></head><body><main><header><div><span class="eyebrow">Autonomous QA engineer</span><h1>SHIPPROOF</h1></div><span class="status">● Proof Mode</span></header><section id="start" class="hero"><div class="panel"><span class="eyebrow">Evidence before confidence</span><h2>Test the application. Then make it prove the bug.</h2><p>Mistral plans and reasons. Solari executes. Every result below comes from the run.</p><div class="launch"><input id="url" value="https://example.com" aria-label="Application URL"><button id="startButton">START QA RUN</button></div><p id="error"></p></div></section><section id="live" class="hidden"><div class="panel"><span class="eyebrow">Live run</span><h2 id="current">Starting...</h2><p id="detail"></p><button id="stopButton" class="stop">STOP RUN</button><div id="timeline"></div></div></section><section id="results" class="hidden"><div class="panel"><span class="eyebrow">Results</span><h2>Generated BugReports</h2><div id="reports"></div></div></section></main><script>
const start=document.querySelector('#start'),live=document.querySelector('#live'),results=document.querySelector('#results'),timeline=document.querySelector('#timeline'),reports=document.querySelector('#reports'),current=document.querySelector('#current'),detail=document.querySelector('#detail'),error=document.querySelector('#error');let runId,stream;
function addEvent(event){if(event.eventType==='run_complete'){current.textContent='QA RUN COMPLETE';stream.close();loadResults();return}if(event.eventType==='run_error'){current.textContent='Run failed';detail.textContent=event.error;stream.close();return}if(event.eventType==='bug_verified'&&event.issue){addReport(event.issue)}current.textContent=event.eventType.replaceAll('_',' ').toUpperCase();detail.textContent=[event.testId,event.action,event.rationale,event.result].filter(Boolean).join(' · ');const item=document.createElement('div');item.className='event'+(event.error?' error':'')+(event.issue?' bug':'');item.textContent=[event.step,event.eventType,event.action,event.result,event.error].filter(Boolean).join(' · ');timeline.prepend(item)}
function addReport(report){const card=document.createElement('article');card.className='panel';card.innerHTML='<span class="eyebrow">'+report.id+'</span><h2>'+escapeHtml(report.title)+'</h2><p class="meta">'+report.severity.toUpperCase()+' · '+report.status.toUpperCase()+' · '+report.confidence+'%</p><p><b>Expected:</b> '+escapeHtml(report.expectedBehavior)+'</p><p><b>Actual:</b> '+escapeHtml(report.actualBehavior)+'</p><p><b>Verification:</b> '+report.verification.successfulAttempts+' / '+report.verification.attempts+' reproductions</p>';for(const file of report.evidence.screenshots){const image=document.createElement('img');image.className='shot';image.src='/api/runs/'+encodeURIComponent(report.runId)+'/screenshots/'+encodeURIComponent(file.split(/[\\/]/).pop());image.alt='Solari evidence screenshot';card.append(image)}reports.append(card)}
async function loadResults(){const data=await fetch('/api/runs/'+runId).then((reply)=>reply.json());reports.textContent='';for(const report of data.reports)addReport(report);results.classList.remove('hidden')}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,(character)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[character]))}
document.querySelector('#startButton').onclick=async()=>{error.textContent='';try{const reply=await fetch('/api/runs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:document.querySelector('#url').value})});const data=await reply.json();if(!reply.ok)throw Error(data.error);runId=data.runId;start.classList.add('hidden');live.classList.remove('hidden');stream=new EventSource('/api/runs/'+encodeURIComponent(runId)+'/events');stream.onmessage=(message)=>addEvent(JSON.parse(message.data))}catch(caught){error.textContent=caught.message}};
document.querySelector('#stopButton').onclick=()=>fetch('/api/runs/'+encodeURIComponent(runId)+'/stop',{method:'POST'});
</script></body></html>
